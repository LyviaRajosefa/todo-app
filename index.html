<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-app</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
    <h1>Todo-app</h1>
    <div class="contenu">
        <label for="ajout">Ajouter une tâche</label>
        <input type="text" id="ajout" placeholder="ecris ici">
        <button id="btn-ajouter">Ajouter</button>
        <button id="suppr-all">Tout supprimer</button>
        <button id="tout">Tout</button>
        <button id="active">Active</button>
        <button id="complete">Complété</button>
        <div id="affichage"></div>
    </div>
</body>
</html>
